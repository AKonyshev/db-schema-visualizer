# Built from the repository root, same as:
#   docker build -f packages/web/Dockerfile -t dbml-schema-visualizer-web .
#   docker run --rm -p 8080:8080 dbml-schema-visualizer-web
#
#   docker compose up --build
# The site is then on http://localhost:8080.

services:
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: dbml-schema-visualizer-web
    ports:
      - "8080:8080"
    # A folder of .dbml files to browse, for an image that was not built around
    # one. See the README section on project schemas inside the image.
    # volumes:
    #   - ./my-project:/srv/schemas:ro
