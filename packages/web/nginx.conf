server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Deliberately absent: `try_files $uri /index.html`. The site has no routing
    # — one document, everything else an asset — so a catch-all could only turn a
    # missing asset into a 200 serving HTML. A bundle that failed to copy would
    # then reach the browser as a script whose body is `<!doctype html>`, and the
    # page would break with no failing request to explain why. A 404 says what
    # happened.
    #
    # `$uri/` is not that catch-all. It asks the index module to serve
    # `index.html` for a directory, which is how `/` finds the entry document at
    # all — and it leaves `/no/such/route` a 404, because that path is not a
    # directory. A `try_files ... /index.html` would be the catch-all.
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Vite fingerprints everything under /assets/, so the name changes whenever
    # the contents do and a stale copy can never be served. Immutable is safe
    # here precisely because of that, and unsafe anywhere the name is stable.
    #
    # `add_header` alone, without nginx's `expires`: the two do not replace each
    # other, they each emit a `Cache-Control`, and a response carrying the header
    # twice is a response whose caching rule depends on which one a proxy reads
    # first.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file whose name never changes, and therefore the one that must not
    # be cached: it carries the references to the fingerprinted assets, so a
    # cached copy pins a reader to the deployment they first visited until they
    # hard-refresh. Every deploy reaches everyone through this file.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Not asked for by the ticket, and kept anyway: the bundle is ~14 MB and
    # compresses to about a fifth of that, which is the difference between the
    # site being usable over a slow link and not. Serving static files without
    # it would be a deliberate choice nobody made.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
